[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skein"
version = "1.0.0"
description = "The continuous engineering context thread: graph, trace, and agent communication."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.2,<4",
  "pydantic>=2.7,<3",
  "jsonschema>=4.22,<5",
  "typer>=0.12,<1",
  "tree-sitter>=0.23,<1",
  "tree-sitter-python>=0.23,<1",
  "tree-sitter-javascript>=0.23,<1",
  "tree-sitter-typescript>=0.23,<1",
  "pypdf>=5,<7",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[project.scripts]
skein = "skein.cli:app"

[tool.setuptools.packages.find]
include = ["skein*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

autopep8 = true

[tool.mypy]
python_version = "3.11"
strict = true

[tool.setuptools.package-data]
skein = ["assets/*.png"]
